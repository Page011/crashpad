<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crashpad</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/island.css">
<link rel="stylesheet" href="css/notes.css">
<link rel="stylesheet" href="css/clips.css">
<link rel="stylesheet" href="css/shots.css">
<link rel="stylesheet" href="css/reminders.css">
<link rel="stylesheet" href="css/shelf.css">
<link rel="stylesheet" href="css/live.css">
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="css/palette.css">
<link rel="stylesheet" href="css/markup.css">
<link rel="stylesheet" href="css/picker.css">
<script type="module" src="app.js"></script>
</head>
<body>
<svg id="fx" width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="glass-lens" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.006 0.009" numOctaves="2" seed="7" result="noise"/><feGaussianBlur in="noise" stdDeviation="2" result="soft"/><feDisplacementMap in="SourceGraphic" in2="soft" scale="28" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
<div id="island" class="island">
  <div class="backdrop"></div>
  <div id="peek" class="peek"></div>
  <div id="activity" class="activity" aria-live="off"></div>
  <div id="alert" class="alert" role="alert"></div>
  <div id="panel" class="panel">
    <nav id="tabs" class="tabs" role="tablist" aria-label="crashpad"></nav>
    <main class="panes">
      <section data-pane="clipboard" role="tabpanel" aria-label="Clipboard"></section>
      <section data-pane="notes" role="tabpanel" aria-label="Notes"></section>
      <section data-pane="shots" role="tabpanel" aria-label="Screenshots"></section>
      <section data-pane="reminders" role="tabpanel" aria-label="Reminders"></section>
      <section data-pane="shelf" role="tabpanel" aria-label="Shelf"></section>
      <section data-pane="live" role="tabpanel" aria-label="Live"></section>
      <section data-pane="settings" role="tabpanel" aria-label="Settings"></section>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
</div>
</body>
</html>
